function slab(ax, ay, bx, by, z0, z1, mat){
  const L = Math.hypot(bx-ax, by-ay); if (L < 1e-3 || z1 <= z0) return;

}

  let s = 0;
  for (const [g0, g1] of [...gaps, [L, L]]) {
    if (g0 > s) slab(w.x0+ux*s, w.y0+uy*s, w.x0+ux*g0, w.y0+uy*g0, 0, H, mat);
