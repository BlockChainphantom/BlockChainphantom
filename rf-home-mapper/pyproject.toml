[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfhome"
version = "0.1.0"
description = "Floor plan and 3D model of a home from Wi-Fi/BLE signal strength (thin-wall radio tomography)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-image>=0.21", "matplotlib>=3.7"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
rfhome = "rfhome.__main__:main"

[tool.setuptools]
packages = ["rfhome"]

[tool.pytest.ini_options]
testpaths = ["tests"]
